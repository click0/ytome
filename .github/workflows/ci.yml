name: CI

# Швидкий цикл на кожен push і PR: типи й версії → тести на матриці
# Node/ОС → збірка, пакування і smoke-тест обох транспортів MCP.
# FreeBSD — окремо (freebsd.yml): він повільніший, тому ганяється рідше.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Type check & version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: TypeScript (strict, no emit)
        run: npx tsc --noEmit

      # package.json = package-lock.json = README/docs
      - name: Version is consistent
        run: node scripts/check-version.mjs

  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Мінімальна підтримувана 20 (better-sqlite3 12, vitest 4) — до поточної
        os: [ubuntu-latest]
        node: ['20', '22', '24']
        include:
          # README обіцяє Windows і macOS — тести мають проходити й там
          - os: windows-latest
            node: '22'
          - os: macos-latest
            node: '22'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm test

  smoke:
    name: Build, package & smoke test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # stdio: кожен рядок stdout — JSON-RPC (лог у stdout ламає Claude Desktop);
      # HTTP: /health і /tools, версія = package.json
      - name: Smoke test (checkout)
        run: node scripts/smoke.mjs

      # Той самий архів, що піде в реліз: має ставитись і працювати сам по собі
      - name: Release archive installs and runs
        run: |
          set -ex
          VERSION=$(node -p "require('./package.json').version")
          sh scripts/package.sh "$VERSION" "$RUNNER_TEMP/release"
          tar -xzf "$RUNNER_TEMP/release/ytome-$VERSION.tar.gz" -C "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/ytome-$VERSION" && npm ci --omit=dev --no-audit --no-fund)
          node scripts/smoke.mjs --dir "$RUNNER_TEMP/ytome-$VERSION"
