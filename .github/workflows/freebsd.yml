name: FreeBSD

# Збірка й тести у VM FreeBSD. better-sqlite3 не має готових бінарників
# під FreeBSD — node-gyp компілює його з вихідників, і саме це тут перевіряється.
#
# Запуск:
#   * push у main і PR → main (гейт мержу);
#   * щотижня (ловить поломки від оновлень pkg / бази);
#   * вручну.
#
# Версії — останні мінорні гілок 14 і 15: репозиторій pkg збирається під
# свіжий мінорний реліз, на старших `pkg install` падає з невідповідністю ядра.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'   # понеділок 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: FreeBSD ${{ matrix.freebsd-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        freebsd-version: ['14.5', '15.1']
    steps:
      - uses: actions/checkout@v7

      - name: Start FreeBSD ${{ matrix.freebsd-version }} VM
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: freebsd
          version: ${{ matrix.freebsd-version }}
          memory: 6G
          cpu_count: 3

      # Далі команди виконуються у VM через cpa.sh (вхід `run` у дії застарів).
      # Код синхронізується у VM лише перед першим кроком; назад нічого не
      # тягнемо — node_modules важать сотні МБ і на runner не потрібні.
      - name: Install packages
        shell: cpa.sh {0} --sync-files runner-to-vm
        run: |
          set -ex
          # python3 і gmake — для node-gyp (збірка better-sqlite3 з вихідників)
          sudo pkg install -y node22 npm-node22 python3 gmake
          uname -a
          node --version
          npm --version

      - name: npm ci (better-sqlite3 from source)
        shell: cpa.sh {0} --sync-files none
        run: npm ci --no-audit --no-fund

      - name: Type check
        shell: cpa.sh {0} --sync-files none
        run: npx tsc --noEmit

      - name: Tests
        shell: cpa.sh {0} --sync-files none
        run: npm test

      - name: Build + smoke test
        shell: cpa.sh {0} --sync-files none
        run: |
          set -e
          npm run build
          node scripts/smoke.mjs
