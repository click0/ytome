name: Release

# Як випустити реліз:
#   1. Підняти версію (package.json, package-lock.json, README/docs) і перенести
#      записи з «## [Unreleased]» у «## [X.Y.Z] - дата» в CHANGELOG.md; змерджити.
#   2. Releases → «Draft a new release» → тег vX.Y або vX.Y.Z (= версії) → Publish.
# Пайплайн зібере архіви, перевірить, що вони ставляться й працюють, додасть
# SHA256SUMS і атестацію походження. Опис — з CHANGELOG.md, якщо у формі його
# лишили порожнім або згенерованим GitHub; написаний вручну текст лишається.
# Те саме при `git push` тегу (тоді реліз створює пайплайн).
# Dry-run: Actions → Release → Run workflow — повна збірка без публікації.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for the dry-run build'
        required: false
        default: 'pipeline test'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------
  # 1. Збірка й перевірка архівів — і для тегу, і для dry-run
  # -------------------------------------------------------------------
  build:
    name: Build & verify release archives
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # попередній тег — для «Full Changelog»

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Version matches tag and docs
        id: version
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            node scripts/check-version.mjs --tag "$GITHUB_REF_NAME"
          else
            node scripts/check-version.mjs
          fi
          case "$VERSION" in *-*) PRE=true ;; *) PRE=false ;; esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (prerelease=$PRE)"

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests (release gate)
        run: npm test

      - run: npm run build

      # Для тегу без розділу в CHANGELOG — стоп: реліз без опису гірший.
      # У dry-run — лише попередження, щоб можна було перевірити решту пайплайна.
      - name: Release notes from CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          TAG="$GITHUB_REF_NAME"
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude "$TAG" HEAD 2>/dev/null || true)
          [ "$GITHUB_REF_TYPE" = "tag" ] || TAG=HEAD
          echo "Previous release tag: ${PREV:-<none>}"
          if ! node scripts/release-notes.mjs --version "$VERSION" ${PREV:+--since "$PREV"} \
               --tag "$TAG" --repo "$GITHUB_REPOSITORY" --output release-notes.md; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then exit 1; fi
            echo "::warning::No CHANGELOG section for $VERSION — fine for a dry-run, not for a release"
            echo "_No CHANGELOG section for $VERSION yet._" > release-notes.md
          fi
          { echo "## Release notes preview — v$VERSION"; echo; cat release-notes.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Package
        run: sh scripts/package.sh "${{ steps.version.outputs.version }}" release

      # Архів має ставитись і працювати сам, без checkout поруч
      - name: Release archive installs and runs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -ex
          tar -xzf "release/ytome-$VERSION.tar.gz" -C "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/ytome-$VERSION" && npm ci --omit=dev --no-audit --no-fund)
          node scripts/smoke.mjs --dir "$RUNNER_TEMP/ytome-$VERSION"

      - name: SHA256SUMS
        working-directory: release
        run: |
          sha256sum ytome-* > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            release/
            release-notes.md
          if-no-files-found: error
          retention-days: 30

  # -------------------------------------------------------------------
  # 2. Публікація — лише за тегом і лише з усіма файлами
  # -------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write        # атестація походження (OIDC цього прогону)
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: .

      # Який коміт, workflow і runner зібрали кожен файл.
      # Перевірка: gh attestation verify <файл> --repo click0/ytome
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/ytome-*

      # Реліз із веб-форми доповнюється: файли додаються, опис замінюється лише
      # порожній або згенерований, назва — лише порожня. Новий реліз (git push тегу)
      # збирається чернеткою і публікується, тільки коли має всі файли.
      - name: Create or complete GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -e
          TAG="$GITHUB_REF_NAME"
          TITLE="ytome $TAG"
          FLAGS=""
          [ "$PRERELEASE" = "true" ] && FLAGS="--prerelease"
          WANT=$(find release -maxdepth 1 -type f | wc -l)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists: completing it"
            gh release view "$TAG" --json body --jq .body > /tmp/current-body.md
            CUR_TITLE=$(gh release view "$TAG" --json name --jq .name)
            EDIT=()
            if node scripts/release-notes.mjs --check-replaceable /tmp/current-body.md; then
              echo "Description is empty/generated: using CHANGELOG notes"
              EDIT+=(--notes-file release-notes.md)
            else
              echo "::notice::Release description was written by hand; keeping it"
            fi
            if [ -z "$CUR_TITLE" ] || [ "$CUR_TITLE" = "$TAG" ]; then
              EDIT+=(--title "$TITLE")
            fi
            OK=true
            gh release upload "$TAG" release/* --clobber || OK=false
            if $OK && { [ ${#EDIT[@]} -gt 0 ] || [ -n "$FLAGS" ]; }; then
              gh release edit "$TAG" "${EDIT[@]}" $FLAGS || OK=false
            fi
            if ! $OK; then
              echo "::error::The existing release $TAG could not be completed."
              echo "::error::With release immutability on (Settings → General → Releases) a published"
              echo "::error::release is frozen. Delete the release (the tag can stay) and re-run this workflow."
              exit 1
            fi
          else
            echo "Creating $TAG as a draft with every file"
            gh release create "$TAG" release/* --draft \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file release-notes.md $FLAGS
          fi

          HAVE=$(gh release view "$TAG" --json assets --jq '.assets | length')
          if [ "$HAVE" -lt "$WANT" ]; then
            echo "::error::release has $HAVE of $WANT files; not publishing an incomplete release"
            gh release view "$TAG" --json assets --jq '.assets[].name'
            exit 1
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" --draft=false
          fi
          gh release view "$TAG" --json name,isDraft,isPrerelease,assets \
            --jq '"published \(.name) (draft=\(.isDraft) prerelease=\(.isPrerelease)) with \(.assets | length) file(s): " + (.assets | map(.name) | join(", "))'
